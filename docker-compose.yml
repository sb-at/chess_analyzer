version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: chessmirror-postgres
    environment:
      POSTGRES_USER: chessmirror
      POSTGRES_PASSWORD: chessmirror_dev
      POSTGRES_DB: chessmirror
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chessmirror"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: chessmirror-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chessmirror-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: chessmirror-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://chessmirror:chessmirror_dev@postgres:5432/chessmirror
      - MONGODB_URL=mongodb://mongodb:27017/chessmirror
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=dev-secret-key-change-in-production
      - STOCKFISH_PATH=/usr/games/stockfish
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: chessmirror-worker
    environment:
      - DATABASE_URL=postgresql://chessmirror:chessmirror_dev@postgres:5432/chessmirror
      - MONGODB_URL=mongodb://mongodb:27017/chessmirror
      - REDIS_URL=redis://redis:6379/0
      - STOCKFISH_PATH=/usr/games/stockfish
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=4

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: chessmirror-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
  mongo_data:
  redis_data:
